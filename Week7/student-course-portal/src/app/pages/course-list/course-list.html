<section class="course-list">
  <h2>Available Courses</h2>
  <p>Browse all available courses below.</p>

  <!-- Step 24: Display selected course ID -->
  <p class="selected-info" *ngIf="selectedCourseId !== null">
    Selected course ID: {{ selectedCourseId }}
  </p>

  <!-- Step 22: *ngFor with [course] and (enrollRequested) -->
  <div class="cards-container">
    <app-course-card
      *ngFor="let course of courses"
      [course]="course"
      (enrollRequested)="onEnroll($event)">
    </app-course-card>
  </div>
</section>

<!-- Step 29+31+32: [ngClass] uses getter; Step 30: [ngStyle] sets border color -->
<!-- Step 34: appHighlight applied on the actual visible div so mouseenter/mouseleave fire on it -->
<div class="course-card"
     [ngClass]="cardClasses"
     [ngStyle]="borderStyle"
     [appHighlight]="highlightColor">

  <p class="course-id">ID: {{ course.id }}</p>
  <h3 class="course-name">{{ course.name }}</h3>
  <p class="course-code">Code: {{ course.code }}</p>

  <!-- Step 36: creditLabel pipe -->
  <p class="course-credits">Credits: {{ course.credits | creditLabel }}</p>

  <!-- Step 27: *ngSwitch grade badge -->
  <span [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'"  class="badge badge--passed">Passed</span>
    <span *ngSwitchCase="'failed'"  class="badge badge--failed">Failed</span>
    <span *ngSwitchDefault          class="badge badge--pending">Pending</span>
  </span>

  <!-- Step 31: Show Details toggle -->
  <div class="card-actions">
    <button class="btn-details" (click)="toggleExpand()">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
    <!-- Step 65: Enroll ↔ Unenroll toggle driven by EnrollmentService.isEnrolled() -->
    <button class="btn-enroll" [class.btn-unenroll]="isEnrolled()" (click)="onEnroll()">
      {{ isEnrolled() ? 'Unenroll' : 'Enroll' }}
    </button>
  </div>

  <!-- Step 31: expanded section -->
  <div class="card-details" *ngIf="isExpanded">
    <p>Status: {{ course.gradeStatus | titlecase }}</p>
    <p>Enrolled: {{ isEnrolled() ? 'Yes' : 'No' }}</p>
  </div>

</div>
